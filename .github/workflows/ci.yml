# GitHub Actions CI — build, test and static-analysis gates.
#
# This is the PUBLIC counterpart to .gitea/workflows/main.yml. It runs the
# same four-pass ladder against the same gates, so a fork or an outside
# contributor's PR is held to the standard the internal build enforces.
#
# ⚠ It is deliberately NOT a copy of the Gitea workflow. Four things invert,
# and each one breaks the build if carried across:
#
#   1. NO CONTAINER. The Gitea job runs in a private image on an internal
#      registry, which a GitHub runner cannot pull. Java comes from
#      actions/setup-java instead.
#   2. ARTIFACT ACTIONS TRACK THE LATEST MAJOR — the exact OPPOSITE of the
#      Gitea file, which is pinned to @v3 because act_runner implements the
#      GHES-style artifact API and rejects v4+. On GitHub, v3 is retired and
#      old majors get force-migrated off deprecated Node runtimes. Neither pin
#      is portable; do not "unify" them, and do not bump the Gitea file to
#      match — it would break that runner.
#   3. NO MAVEN MIRROR. Everything resolves from Maven Central. Verified by a
#      cold build with an empty local repo and no settings.xml: 1030
#      artifacts, all from `central`.
#   4. NO SONAR, NO NEXUS DEPLOY. Those target internal hosts. Nothing goes to
#      Maven Central; a tag cuts the GitHub Release with the distribution zip,
#      and a tag or a push to main pushes the container image to Docker Hub
#      (publish-image). Non-tag runs resolve sibling snapshots from Central's
#      snapshot repository (settings step).
#
# Nothing in the pom is CI-specific: `mvn install` with no -P builds the whole
# reactor, so the commands below match what a developer runs locally.

name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main, master]
  # Manual DRY RUN of the publishing path. The release path only executes on
  # tags, so every defect in it has cost a tag to discover (v0.0.1 metadata,
  # v0.0.3 gpg). This runs the full ladder and the real signing on a real
  # runner, then stops short of uploading — see central.skipPublishing below.
  workflow_dispatch:

# Supersede an in-flight run when new commits land on the same ref. The Pitest
# pass is the long pole, so without this two runs compete for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull_request run is superseded. A push to main publishes (snapshot / image) and a
  # tag cuts a release: cancelling either mid-publish leaves a half-published state, so
  # those runs queue instead (review G1).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The mutation pass is single-threaded and by far the longest step; cap the
    # job so a hung minion cannot hold a runner indefinitely.
    #
    # ⚠ 120, not the 45 the other cumba-oss repos use. cumba-oss-corej-core
    # generates ~14,400 mutations - an order of magnitude more than any module in
    # commons / formats / datatable, whose whole build job finishes in 1-3 minutes.
    # The first public run was CANCELLED at exactly 45m24s with Pitest still going
    # after 39m45s. That was this cap, not a GitHub limit: Actions is free and
    # unmetered for public repositories, and the hard ceiling is 6 hours per job.
    #
    # A cold run has to complete ONCE for ~/.pitest-history to be worth restoring;
    # warm runs on the other repos take well under a minute. Revisit once the
    # history cache is established, ideally by giving Pitest its own job.
    timeout-minutes: 120
    # Consumed by the release job to name the release without recomputing it.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        # `shell: bash` gives `bash -eo pipefail`, so a failed `mvn ... | tee`
        # propagates instead of returning tee's exit code (0).
        shell: bash
    env:
      # Every static-analysis check that is report-only locally is flipped to
      # "fail on finding" here. Pitest is NOT in this list — it is the heaviest
      # gate and runs LAST in its own pass, so a cheap failure aborts the build
      # before any mutation work happens.
      MAVEN_CI_GATES: -Dmaven.compiler.failOnWarning=true -Dspotless.check=true -Dpmd.failOnViolation=true -Dspotbugs.failOnError=true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # ⭐ Sibling -SNAPSHOT artifacts (net.cumba:cumba-oss-*) resolve from the
      # Central Portal snapshot repository. The poms deliberately name NO
      # snapshot repository (each forge supplies its own), so this step writes a
      # settings file and hands it to every later Maven call through MAVEN_ARGS,
      # which Maven reads from 3.9 on. `-gs` (global settings) MERGES with the
      # user ~/.m2/settings.xml that setup-java writes for the Central
      # credentials; nothing is overwritten. It must run before the first `mvn`.
      # ⚠ An older Maven IGNORES MAVEN_ARGS without a word and resolves no
      # sibling snapshot, so the step refuses a Maven below 3.9, loudly.
      # ⚠ Tag runs get neither the file nor the variable: a release resolves
      # released artifacts only (requireReleaseDeps guards that as well).
      # This step is byte-identical in every cumba-oss repo; copy it unchanged.
      - name: Configure Central snapshot repository
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Unanchored: a colour code may precede "Apache Maven" on the line.
          mvn_version="$(mvn -B -v 2>/dev/null | sed -n 's/.*Apache Maven \([0-9][0-9.]*\).*/\1/p' | head -1)" || mvn_version=""
          IFS=. read -r mvn_major mvn_minor _ <<< "${mvn_version:-0.0}"
          if (( mvn_major < 3 || (mvn_major == 3 && mvn_minor < 9) )); then
            echo "::error::Maven '${mvn_version:-?}' (from mvn -v): MAVEN_ARGS needs Maven >= 3.9 (an older one ignores it silently, and no sibling snapshot resolves)." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/central-snapshots.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <profiles>
              <profile>
                <id>central-portal-snapshots</id>
                <repositories>
                  <repository>
                    <id>central-portal-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <releases><enabled>false</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>central-portal-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          # Append, never replace: keep any MAVEN_ARGS set before this step.
          echo "MAVEN_ARGS=${MAVEN_ARGS:+$MAVEN_ARGS }-gs $RUNNER_TEMP/central-snapshots.xml" >> "$GITHUB_ENV"

      # Restore at the top; save in a matching step at the end (not
      # setup-java's built-in cache) so a run that downloads new dependencies
      # and then fails still persists them, warming the next — likely still red
      # — run. Content-keyed on the poms, so once an entry exists for these
      # poms the save is a no-op.
      - name: Restore Maven dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Show toolchain
        run: |
          java -version
          mvn -version
          python3 --version
          git --version

      # A tag yields its own version (v1.2.3 -> 1.2.3); anything else keeps the
      # pom's SNAPSHOT default. Identical logic to the Gitea workflow, so the
      # same tag produces identically-versioned jars on both platforms.
      - name: Determine revision
        id: ver
        run: |
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # ⛔ Read the dev version from the pom; do NOT hardcode it. This line said
            # 0.1.0-SNAPSHOT in all eight repos, which stopped being any repo's dev
            # version the first time a line moved on -- so this lane gated a version
            # unrelated to the one it was building. The comment above already claimed
            # the pom default was being used; now it is. Matches the Gitea workflow.
            VERSION="$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml | head -1)"
            if [[ -z "$VERSION" || "$VERSION" != *-SNAPSHOT ]]; then
                echo "::error::pom.xml <revision> is '$VERSION' - expected a -SNAPSHOT dev version." >&2
                exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # Pass 1 (cheapest, most common failure): spotless across the WHOLE
      # reactor. Fails in seconds on formatting drift, before a class is
      # compiled.
      - name: Spotless check
        run: mvn -B spotless:check -Drevision=${{ steps.ver.outputs.version }}

      # Pass 2: compile + Error Prone / NullAway + javac -Xlint warnings gate.
      - name: Build
        run: mvn -B test-compile -Drevision=${{ steps.ver.outputs.version }} ${MAVEN_CI_GATES} | tee maven-build.log

      - name: Upload Maven Build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-build-log
          path: maven-build.log
          if-no-files-found: warn
          retention-days: 14

      # Pass 3: unit tests + JaCoCo + PMD + SpotBugs. Every cheaper gate must
      # be green across ALL modules before any module spends time mutating.
      - name: Test & Verify
        run: mvn -B install -Drevision=${{ steps.ver.outputs.version }} ${MAVEN_CI_GATES} | tee maven-verify.log

      - name: Upload Maven Test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-verify-log
          path: maven-verify.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-reports
          path: |
            **/target/spotbugsXml.xml
            **/target/pmd.xml
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
            **/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

      # Restored only here, immediately before the mutation pass, and only if we
      # reach it — a run that failed an earlier gate never pulls this cache.
      # ⚠ HOME, not the repo root: actions/checkout runs `git clean -ffdx` on a
      # reused workspace and `-x` deletes IGNORED files too, so a gitignored
      # in-repo path would not be safe. The pom pins the history to
      # ${user.home} to match.
      - name: Restore Pitest history
        uses: actions/cache/restore@v6
        with:
          path: ~/.pitest-history
          key: ${{ runner.os }}-pitest-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pitest-

      # Pass 4 (heaviest, LAST): mutation testing. `-DskipTests` suppresses the
      # redundant surefire re-run (pitest forks its own test JVMs); the pitest
      # plugin's own `skipTests` is pinned false in the pom so this does NOT
      # silently turn the gate into a no-op.
      #
      # ⚠ This step deliberately does not fail the job. A failing mutation gate
      # must still publish its log and reports — those artifacts ARE the
      # diagnosis. `if: always()` covers a non-zero exit but NOT a step killed
      # outright (OOM, job timeout), and this is the longest step here. So:
      # capture the code, let the step pass, upload, then re-raise below.
      - name: Pitest
        id: pitest
        run: |
          set -o pipefail
          # Guarantee the cache path exists: the save below runs once this step
          # starts, and actions/cache fails a save whose path is missing.
          mkdir -p ~/.pitest-history
          rc=0
          # ⚠ -Dassembly.skipAssembly: this pass does not need the 55-75 MB distribution
          #    zip, and the assembly would rebuild it (and its exploded copy) from
          #    scratch. No pass runs `clean`, so the bundle built by the install pass
          #    above is still in target/ for the smoke-test and upload steps below.
          mvn -B -P Pitest verify -DskipTests -DskipPmd -DskipSpotbugs -Dspotless.check=true \
              -Dassembly.skipAssembly=true \
              -Dpitest.enabled=true -Dpitest.failOnError=true \
              -Drevision=${{ steps.ver.outputs.version }} | tee maven-pitest.log || rc=$?
          echo "$rc" > pitest.rc
          echo "Pitest exit code: $rc"

      - name: Upload Pitest log and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-reports
          path: |
            maven-pitest.log
            **/target/pit-reports/**
          if-no-files-found: warn
          retention-days: 7

      # Re-raise the mutation result AFTER the upload, preserving the original
      # semantics: a red Pitest still fails the build, only now the evidence is
      # already published.
      - name: Pitest gate
        if: ${{ always() && steps.pitest.conclusion != 'skipped' }}
        run: |
          rc="$(cat pitest.rc 2>/dev/null || echo 1)"
          if [ "$rc" -ne 0 ]; then
              echo "::error::Pitest mutation gate failed (exit code $rc) — see the pitest-reports artifact."
              exit "$rc"
          fi
          echo "Pitest mutation gate passed."

      # ⛔ PROVE THE BUNDLE RUNS BEFORE ATTACHING IT TO A RELEASE.
      #
      # Before the bundle existed the release asset was the thin application jar: no
      # Main-Class, no dependencies, `java -jar` on it simply fails — and nothing in
      # `mvn verify` noticed, because nothing ever tried to start it. This step starts
      # the assembled service and talks to it. It is also the regression test for the
      # jspecify scope fix: `provided` is excluded from every runtime classpath, so a
      # relapse kills the ApplicationContext here rather than in production.
      #
      # ⚠ The exploded `dir` format nests the assembly's <baseDirectory> inside
      # <finalName>, hence the doubled path below.
      - name: Smoke-test the distribution bundle
        run: |
          set -eo pipefail
          bundle="target/cumba-oss-corej-rule-editor-rest-${{ steps.ver.outputs.version }}/cumba-oss-corej-rule-editor-rest-${{ steps.ver.outputs.version }}"
          ls -la "$bundle"
          bash src/test/smoke.sh "$bundle"

          # ⛔ The upload below globs BOTH .jar and .zip, and `if-no-files-found: error`
          #    fires only when NOTHING matches — so a vanished zip would ship a
          #    jar-only release silently, which is the exact failure this bundle
          #    exists to remove. Assert it here, where the message can say so.
          zip="target/cumba-oss-corej-rule-editor-rest-${{ steps.ver.outputs.version }}.zip"
          [ -f "$zip" ] || { echo "::error::$zip was not built — the release would carry only the unrunnable jar"; exit 1; }
          ls -l "$zip"

      # Hand the release assets to the release job. Short-lived hand-off -> low retention.
      #
      # ⚠ The glob is VERSION-SCOPED, not `*.jar`. No pass runs `clean`, so on a
      # reused workspace target/ can still hold jars from an earlier build at a
      # different version — a bare `*.jar` would attach those to the release
      # alongside the real ones. Measured: a workspace that had built
      # 0.1.0-SNAPSHOT and then 9.9.9 matched 8 jars for 4 modules.
      # ⭐ On EVERY push, not only tags (PLAN-ci-snapshots-and-container-images D5, review
      # M2): the zip is also the publish-image job's input, so main's image carries the
      # same bytes as its release zip would. The release job still runs on tags only.
      - name: Upload release assets
        # Also on a workflow_dispatch of a tag ref: the release job needs the zip (review G3).
        if: ${{ github.event_name == 'push' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          # ⚠ target/, not clients/*/target/ — single module now, and
          #   upload-artifact only WARNS on a no-match.
          #
          # ⭐ BOTH extensions. The .zip is the RUNNABLE distribution and is what a
          #   consumer actually wants; the .jar is kept because it is the same artifact
          #   that goes to Nexus and some consumers put it on their own classpath.
          #   Attaching only the jar is what made every release asset unrunnable.
          path: |
            target/*-${{ steps.ver.outputs.version }}.jar
            target/*-${{ steps.ver.outputs.version }}.zip
          # ⚠ if-no-files-found: error, below, because these artefacts are NOT
          #    published to Central — the forge release is the ONLY delivery, so a
          #    silent no-match would ship a release with no assets at all. (It cannot
          #    catch a MISSING ZIP once both globs are listed: it fires only when
          #    nothing matches. That is what the zip assertion in the smoke step is
          #    for.)
          if-no-files-found: error
          retention-days: 2

      # Purge our own freshly-built artifacts BEFORE saving, so the cache holds
      # only third-party dependencies.
      - name: Purge own artifacts from local repo
        if: always()
        run: rm -rf ~/.m2/repository/net/cumba

      # ⚠ Saves are gated to `push`. A pull_request from a FORK gets read-only
      # cache access, so a save there fails; restores still work, so fork PRs
      # keep the warm-start benefit without erroring.
      - name: Save Maven dependencies
        uses: actions/cache/save@v6
        if: ${{ always() && github.event_name == 'push' }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Save Pitest history
        uses: actions/cache/save@v6
        if: ${{ always() && github.event_name == 'push' && steps.pitest.conclusion != 'skipped' }}
        with:
          path: ~/.pitest-history
          key: ${{ runner.os }}-pitest-${{ github.run_id }}

  # Build + push the container image (PLAN-ci-snapshots-and-container-images phase 3; D5, D7,
  # D8). Consumes the release zip the build job uploaded, so the build runs once and the image
  # carries the release's bytes: no Maven or npm inside the image build. Docker Hub,
  # docker.io/p300/corej-rule-editor-rest, linux/amd64 + linux/arm64 (QEMU for the second).
  # Tags (D7): a tag vX.Y.Z -> X.Y.Z + latest (`latest` only ever means a release); main ->
  # the pom's X.Y.Z-SNAPSHOT (moving) + sha-<short commit> (immutable).
  # Pins track the latest major (BLUEPRINT pin policy for GitHub); the Gitea workflow builds
  # no image at all (D9), so there is no second file to keep in step.
  # ⚠ Needs the org secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (D8); never runs on a PR.
  publish-image:
    needs: build
    # Fork guard (review G2): a fork has no Docker Hub secrets and must never push.
    if: ${{ github.repository_owner == 'cumba-oss' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      IMAGE_REGISTRY: docker.io
      IMAGE_NAME: corej-rule-editor-rest
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: release-archives

      # Unpack the release zip into image-ctx/<name>/, the path Dockerfile.runtime COPYs.
      # unzip keeps the modes the assembly set; python3's zipfile drops them, which is why
      # Dockerfile.runtime chmods what must be executable anyway. Never `jar xf`.
      - name: Stage the image context
        run: |
          set -euo pipefail
          # download-artifact may keep the files' target/ path (measured on this forge too,
          # see the release job's flatten step): find the zip, and require exactly one at
          # this version.
          mapfile -t zips < <(find release-archives -type f -name "*-${VERSION}.zip")
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected ONE *-${VERSION}.zip in the artifact, found ${#zips[@]}: ${zips[*]:-}"; exit 1; }
          rm -rf image-ctx/stage "image-ctx/${IMAGE_NAME}"
          mkdir -p image-ctx/stage
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "${zips[0]}" -d image-ctx/stage
          elif command -v python3 >/dev/null 2>&1; then
            python3 -m zipfile -e "${zips[0]}" image-ctx/stage
          else
            echo "::error::neither unzip nor python3 on the runner"; exit 1
          fi
          # The REST zip holds ONE top-level directory, cumba-oss-corej-rule-editor-rest-<version>/ — strip it.
          top="image-ctx/stage/cumba-oss-corej-rule-editor-rest-${VERSION}"
          [ -d "$top" ] || { echo "::error::$top missing: the zip's top-level directory changed"; ls -la image-ctx/stage; exit 1; }
          mv "$top" "image-ctx/${IMAGE_NAME}"
          rm -rf image-ctx/stage
          ls -la "image-ctx/${IMAGE_NAME}"

      # D7: a tag -> X.Y.Z + latest; main -> the build's X.Y.Z-SNAPSHOT + sha-<short>.
      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/p300/${IMAGE_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # `latest` only for the HIGHEST release tag (review G4): a patch tag cut on an
            # older line (v0.4.3 after v0.5.0) must not move `latest` backwards. ls-remote
            # reads the remote's tags; the shallow checkout above holds only this one.
            tag="${GITHUB_REF#refs/tags/}"
            highest="$(git ls-remote --tags origin 'v*' | sed -e 's#^.*refs/tags/##' -e 's#\^{}$##' \
              | grep -E '^v[0-9]+(\.[0-9]+){2,3}$' | sort -uV | tail -1)" \
              || { echo "::error::could not list the remote's release tags"; exit 1; }
            if [ "${highest}" = "${tag}" ]; then
              tags="${image}:${VERSION},${image}:latest"
            else
              tags="${image}:${VERSION}"
              echo "::notice::${tag} is not the highest release tag (${highest}): \`latest\` stays where it is"
            fi
          else
            tags="${image}:${VERSION},${image}:sha-${GITHUB_SHA::7}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Image tags: ${tags}"

      # An unset secret arrives as the EMPTY string and login-action then fails with a
      # generic message; name the two secrets instead (owner action, D8).
      - name: Check the Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "::error::the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are empty or unset" \
                   "(org cumba-oss). Refusing to build an image that cannot be pushed." >&2
              exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # QEMU emulates arm64 for the RUN steps of the second platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The base image is Dockerfile.runtime's default (Docker Hub): no build arg, no host.
      # provenance off: a plain manifest list, no attestation entries.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.tags.outputs.tags }}

  #
  # This is the PUBLIC release. The Gitea workflow cuts its own release for the
  # same tag from the same jars, and additionally deploys to the internal Nexus.
  # The two are independent: releases are not git refs, so nothing syncs them —
  # each platform's workflow builds and publishes its own.
  release:
    needs: [build, publish-image]
    # A workflow_dispatch on a tag ref must still cut the release (review G3): publish-image
    # runs on push only, so there it is SKIPPED, which by default would skip this job too.
    # A FAILED or cancelled publish-image still blocks the release; !cancelled() keeps a
    # cancelled run from releasing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' && (needs.publish-image.result == 'success' || needs.publish-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      # Overrides the workflow-level `contents: read`; creating a release writes.
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: release-archives

      # ⛔ NORMALISE THE LAYOUT — do not guess it.
      #
      # upload-artifact does NOT reliably collapse to the least-common-ancestor, on
      # EITHER forge. Measured 2026-09-03 on GitHub (cumba-oss-corej-web): upload and
      # download both SUCCEEDED and the signing step still found nothing, because the
      # files kept their original target/ path inside the download directory.
      #
      # "Create GitHub Release" below uses `find` and is immune, but the signing loop
      # is not — and both must agree on the shape. Flatten once; both can then assume it.
      - name: Flatten downloaded assets
        run: |
          set -eo pipefail
          echo "as downloaded:"
          find release-archives -type f | sort
          while IFS= read -r f; do
              [ "$(dirname "$f")" = "release-archives" ] || mv -v "$f" release-archives/
          done < <(find release-archives -type f \( -name '*.jar' -o -name '*.zip' \))
          find release-archives -mindepth 1 -type d -empty -delete
          echo "flattened:"
          find release-archives -type f | sort

      # ⭐ SIGN EVERY JAR — the reason is STRONGER here than on Maven Central.
      #
      # These artefacts are NOT published to Central, so this release is the only public
      # delivery. A release asset CAN be replaced in place by anyone with write access,
      # so the signature is the only thing between a consumer and a silently swapped jar.
      # Same key as cumba-oss-corej-rules and -corej-web, so consumers have ONE trust
      # root across the suite, not one per repository.
      #
      # ⚠ --batch --yes --pinentry-mode loopback: there is no tty on a runner, and
      #    without loopback gpg tries to prompt and HANGS the job rather than failing it.
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          # ⚠ This repository has never cut a tag, so GPG_PRIVATE_KEY has never been
          #    exercised here. An unset secret arrives as the EMPTY STRING, and gpg then
          #    exits 2 with "gpg: no valid OpenPGP data found" (verified 2026-09-04,
          #    gpg 2.4.8) — which reads as a MALFORMED key and sends the next reader
          #    after the key material rather than after an unset secret. Name it here.
          if [ -z "$GPG_PRIVATE_KEY" ]; then
              echo "::error::the GPG_PRIVATE_KEY secret is empty or unset in this" \
                   "repository. Set GPG_PRIVATE_KEY and GPG_PASSPHRASE to the key" \
                   "cumba-oss-corej-rules already signs with. Refusing to publish" \
                   "unsigned assets." >&2
              exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Sign release assets
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eo pipefail
          shopt -s nullglob
          # ⚠ Both extensions, and the zip matters MORE than the jar: it is the
          #   runnable artefact, so it is the one worth tampering with.
          jars=(release-archives/*.jar)
          zips=(release-archives/*.zip)
          # ⚠ Each kind checked SEPARATELY. A combined "is the list empty" test passes
          #   when the runnable zip is missing and only the jar survived — the silent
          #   half-release this whole change exists to prevent.
          if [ ${#jars[@]} -eq 0 ]; then
              echo "no jar to sign — the release would be incomplete" >&2
              exit 1
          fi
          if [ ${#zips[@]} -eq 0 ]; then
              echo "no distribution zip to sign — the release would carry only the unrunnable jar" >&2
              exit 1
          fi
          assets=("${jars[@]}" "${zips[@]}")
          for f in "${assets[@]}"; do
              gpg --batch --yes --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --armor --detach-sign "$f"
              gpg --verify "$f.asc" "$f"
              echo "signed: $f"
          done

      # `gh` is preinstalled on GitHub-hosted runners, so this needs no
      # third-party action — one less dependency to pin and audit in a public
      # repo. --verify-tag refuses to invent a tag that does not exist.
      #
      # ⚠ GH_REPO is REQUIRED here. This job deliberately has no
      # actions/checkout — it only needs the artifact, not the source — but
      # `gh` resolves its target repository from the git remote in the working
      # directory. Without a checkout and without GH_REPO it dies before making
      # any API call:
      #     failed to run git: fatal: not a git repository
      # which is how the v0.0.2 release job failed. GH_REPO is the fix that
      # keeps the checkout unnecessary.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          echo "attaching:"
          find release-archives \( -name '*.jar' -o -name '*.zip' -o -name '*.asc' \) | sort
          gh release create "${GITHUB_REF_NAME}" \
              --title "Cumba OSS coreJ Rule Editor REST ${{ needs.build.outputs.version }}" \
              --generate-notes \
              --verify-tag \
              $(find release-archives \( -name '*.jar' -o -name '*.zip' -o -name '*.asc' \) | sort)
