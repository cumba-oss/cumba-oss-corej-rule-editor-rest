# The rule editor as two containers (PLAN-rule-editor §4.2 shape 2, RE-Q6):
#
#   rule-editor-web   nginx serving the built SPA and proxying /api (and the OpenAPI
#                     paths) to the rest container — so the browser sees ONE origin and
#                     the session cookie + CSRF need no cross-site handling;
#   rule-editor-rest  the API, with the per-user git workspaces and the metadata store
#                     on volumes.
#
# Build contexts are the two sibling checkouts cumba-oss-corej-rule-editor-{rest,web} (the web
# repo's DOCKER.md, step 1). Both Dockerfiles build FROM THE SOURCES (multi-stage: Maven, resp.
# Node, inside the build), so after a `git pull`
#
#     docker compose up --build
#
# is the whole build — nothing to run beforehand, no stale target/ or dist/ to package.
# The rest build resolves its dependencies from Maven Central with no settings at all, which is
# enough for a RELEASE of this repository. `main` between releases pins the cumba-oss-*
# DEVELOPMENT snapshots, which Central does not host (the Dockerfile's header): give the build a
# Maven settings.xml naming a repository that serves them, as the OPTIONAL build secret
# `maven_settings` — mounted for the Maven step only, never stored in an image layer — with a
# docker-compose.override.yml beside this file (compose merges it in by itself):
#
#     services:
#       rule-editor-rest:
#         build:
#           secrets:
#             - maven_settings
#     secrets:
#       maven_settings:
#         file: ${HOME}/.m2/settings.xml
#
# Never copy the settings file into the build context.
#
# Then point the service at your repository and forge — EDIT the environment below or
# mount a config directory at /etc/rule-editor (config/README.md) — and open
# http://127.0.0.1:8080/. The repository is never bundled: every user's workspace is a
# clone fetched with THEIR token (§5.1.5–5.1.6).
#
# ⚠ HTTPS (security review M3). The SPA's nginx speaks plain HTTP and is published on the
# LOOPBACK only (127.0.0.1): the forge token lives in the session, and its cookie is
# Secure. To serve other machines, put a TLS-terminating reverse proxy in front of port
# ${WEB_PORT} (it also sets HSTS) — plain HTTP to anything but localhost is NOT supported.
# Chrome and Firefox send a Secure cookie to http://localhost, so a trial on this machine
# works as it is. Trial opt-out ONLY, for a throw-away instance: COOKIE_SECURE=false (and,
# to reach it from elsewhere, edit the port binding) — never for real tokens.
#
# ⚠ THE METADATA STORE. Everything that needs CDISC Library content — the analysis,
# completion, tooltips, the scenario runs — reads OUR metadata store (the FILE
# CDISC_METADATA_STORE names below, in the `metadata-store` volume), never the Library's
# pickle or web API (databrowser-meta CLAUDE.md). The service SEEDS IT ITSELF at start-up
# (owner, 2026-10-08), in the background, when the volume holds none:
#   EDITOR_STORE_SEED_TYPE     GITHUB_PKL (default): the pickles of the cdisc-rules-engine
#                              tag below from GitHub (resources/cache), no key needed — one
#                              ~80 MB download, a few minutes on the first start;
#                              API: the CDISC Library API with EDITOR_STORE_SEED_API_KEY;
#                              NONE: never seed — put a store into the volume by hand.
#   EDITOR_STORE_SEED_PKL_TAG  the cdisc-rules-engine tag (default v0.17.1).
#   EDITOR_STORE_SEED_API_KEY  API only; never logged, never served.
# The service answers at once: until the seed is done the editor shows "No metadata store
# on this instance (metadata store is being seeded (GITHUB_PKL v0.17.1)…)", then the store
# opens without a restart (a failure shows its reason; the service runs on without a
# store). The store is written beside the final file and moved over it atomically, with
# a seed record metadata-store.zip.seed.json (type, tag, seededAt, complete): change the
# type or the tag and the next start re-seeds; a seed whose downloads partly failed is
# used (when there was no store) but recorded incomplete and re-seeded at the next start;
# to force a re-seed, delete metadata-store.zip from the volume and restart. A store of
# an OLDER format is re-seeded, seed record or not; a NEWER one (written by a newer
# build) is never replaced; a store of the current format without a seed record (put
# there by hand) is left alone, and so is a store path that is a directory. /api/info
# reports the seed as engine.seeding (true while it runs) and engine.seedStatus (its
# state, also while an old store serves). One seed per volume at a time: a second
# container finds metadata-store.zip.seed.lock held and does not seed.
#
# ⚠ MEMORY. JAVA_OPTS sizes the API JVM only. Every run is a CHILD JVM with its own
# heap (EDITOR_RUN_MAX_HEAP, default 1g), up to EDITOR_RUN_MAX_CONCURRENT at once,
# killed past EDITOR_RUN_TIMEOUT: give the container JAVA_OPTS heap + max-concurrent ×
# max-heap, or lower the two run settings.
#
# The same recipe runs for the internal twin on rootless Podman (podman-compose, WSL2) since
# 2026-10-08; this twin's images have not been started yet. ⚠ On a WSL2 kernel
# netavark cannot program nftables for the network below ("nft" did not return successfully):
# switch it to iptables (the web repo's DOCKER.md, step 5b) or run the pod recipe there.

services:
  rule-editor-rest:
    build:
      context: .
    environment:
      # One instance serves ONE repository on ONE forge (§5.1.1, O9).
      EDITOR_REPOSITORY_URL: ${EDITOR_REPOSITORY_URL:-https://github.com/cumba-oss/cumba-oss-corej-rules.git}
      EDITOR_FORGE_TYPE: ${EDITOR_FORGE_TYPE:-github}
      EDITOR_FORGE_API_URL: ${EDITOR_FORGE_API_URL:-https://api.github.com}
      EDITOR_WORKSPACE_ROOT: /var/lib/rule-editor/workspaces
      # The engine reads the store FILE from here; the service seeds it at start-up when
      # the volume holds none (see the note above).
      CDISC_METADATA_STORE: /var/lib/rule-editor/metadata-store/metadata-store.zip
      EDITOR_STORE_SEED_TYPE: ${EDITOR_STORE_SEED_TYPE:-GITHUB_PKL}
      EDITOR_STORE_SEED_PKL_TAG: ${EDITOR_STORE_SEED_PKL_TAG:-v0.17.1}
      EDITOR_STORE_SEED_API_KEY: ${EDITOR_STORE_SEED_API_KEY:-}
      # The API JVM; the run workers are separate JVMs sized by the three settings below.
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1g}
      EDITOR_RUN_MAX_HEAP: ${EDITOR_RUN_MAX_HEAP:-1g}
      EDITOR_RUN_MAX_CONCURRENT: ${EDITOR_RUN_MAX_CONCURRENT:-2}
      EDITOR_RUN_TIMEOUT: ${EDITOR_RUN_TIMEOUT:-PT60S}
      # The session cookie is Secure (see the HTTPS note above); false is a trial opt-out only.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Believe X-Forwarded-For (for the per-client limits: logins, anonymous runs and
      # searches — security review M4) and X-Forwarded-Proto/-Host/-Port (the scheme, host
      # and port the CORS check compares with the Origin behind a TLS proxy) only from the
      # compose network pinned below, where
      # nginx lives — NEVER from every private range: a client in a trusted block cannot be
      # told from a proxy and would get a fresh limit key per request by forging the header.
      # ⚠ The network's gateway is in the block too: whatever reaches nginx from the host
      # (your TLS proxy — the port is bound to the loopback) is believed as well, so that
      # proxy must append the real client to X-Forwarded-For, overwrite X-Forwarded-Proto
      # and drop a client's X-Forwarded-Host/-Port. Keep this equal to the subnet.
      EDITOR_TRUSTED_PROXIES: ${EDITOR_TRUSTED_PROXIES:-172.28.40.0/24}
    volumes:
      - workspaces:/var/lib/rule-editor/workspaces
      - metadata-store:/var/lib/rule-editor/metadata-store
    # Not published: only nginx talks to it. Uncomment to reach the API directly.
    # ports:
    #   - "8081:8081"
    networks:
      - editor
    restart: unless-stopped

  rule-editor-web:
    build:
      context: ../cumba-oss-corej-rule-editor-web
    depends_on:
      - rule-editor-rest
    environment:
      # The look (PLAN-web-branding-and-theme): the brand folder nginx serves as /brand/ —
      # neutral by default, p300 ships too; a brand of your own is mounted at
      # /usr/share/nginx/html/brands/<name> (the web repo's DOCKER.md). An unknown name stops
      # the container at start-up, naming the available ones.
      BRAND: ${BRAND:-neutral}
    ports:
      # the loopback only: plain HTTP never leaves this machine (see the HTTPS note above)
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - editor
    restart: unless-stopped

volumes:
  workspaces:
  metadata-store:

networks:
  editor:
    ipam:
      config:
        # Pinned so EDITOR_TRUSTED_PROXIES can name exactly this block (security review M4).
        # If it collides with a network of the host, change it AND EDITOR_TRUSTED_PROXIES.
        - subnet: 172.28.40.0/24
