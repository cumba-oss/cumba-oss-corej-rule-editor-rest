# Permanent SonarQube issue suppressions.
#
# Loaded into the Maven build by properties-maven-plugin
# (read-project-properties execution in the root pom.xml). Every key
# here is exposed as a Maven property prefixed with `sonar.` so the
# sonar-maven-plugin picks it up at sonar:sonar time.
#
# When adding entries:
#   1. Append a new id to the comma-separated
#      `sonar.issue.ignore.multicriteria` list.
#   2. Add the matching `.ruleKey` + `.resourceKey` pair using that id.
#   3. Document the rationale in a comment block above the entry.
#
# The list is intentionally empty in the template. Start by adding the
# first id and the matching `.ruleKey` / `.resourceKey` entries.
#
# Example:
#
# sonar.issue.ignore.multicriteria=ex1
# sonar.issue.ignore.multicriteria.ex1.ruleKey=java:S2095
# sonar.issue.ignore.multicriteria.ex1.resourceKey=**/SomeClass.java

# Sonar exclusions intentionally left empty; populate per project.
