#
# Test-scope java.util.logging configuration for this repository.
#
# Wired in by <java.util.logging.config.file> in the root pom, twice: once in
# Surefire's <systemPropertyVariables> and once, byte-identically, in the Pitest
# <jvmArgs> -- pitest forks its own minions and inherits neither Surefire's
# properties nor its argLine, exactly as with projectBasedir / repoRoot beside it.
#
# It exists ONLY to keep the build log readable. Unit tests deliberately drive
# production code down its warning and error paths, so the records the application
# emits are EXPECTED NOISE rather than information about the run.
#
# Measured 2026-09-22 over four complete CI job logs (4297 KiB of runner output):
# 52% of every byte was application logging, 44% was application INFO alone. In
# cumba-corej-rules a SINGLE INFO call site -- RulePackageLoader.
# logDerivationDisagreement, 6294 records -- was 61% of the entire job log.
#
# ⚠⚠ THE RECORDS ARE STILL CREATED. Only the console handler is filtered, and the
# root level stays at INFO. This is what keeps the 71 test classes that assert on
# log output green: every LoggerCapture / LogCapture helper attaches its OWN
# handler to the logger it taps and sets that logger to Level.ALL, so it observes
# records this file never prints. Lowering `.level` instead would work today only
# because all 11 helpers happen to set the level -- do not rely on that.
#
# ⚠⚠ THE PATH TO THIS FILE MUST NOT CONTAIN A SPACE. Pitest splits every <jvmArg>
# on whitespace, so a spaced value arrives as several arguments and the minion
# dies with MINION_DIED / "Could not find or load main class ...". Same trap as
# the SimpleFormatter.format property it sits next to; a plain `mvn test` stays
# green in that state and only `-P Pitest` reds.
#
# ⚠ java.util.logging.SimpleFormatter.format is deliberately NOT set here.
# SimpleFormatter prefers the LogManager property over the system property, so
# defining it here would silently become the second source of truth for a value
# that must stay byte-identical across the Surefire and Pitest blocks.
#
# ⚠ This file governs JUL only. Two arms of the stack are NOT JUL: cumba-corej-rest
# binds SLF4J to Logback and is configured by src/test/resources/logback-test.xml
# (<root level="WARN">), and cumba-parso's vendored tests bind to slf4j-simple,
# which this file does not reach.
#
# Full rationale: "Application logging in test and mutation logs" in
# .claude/docs/build-gates.md of the databrowser-meta umbrella repo.
#

# Records are still produced at INFO -- the filtering happens at the handler
# below, so an attached capture handler still sees everything.
.level = INFO

handlers = java.util.logging.ConsoleHandler

# The actual switch. Raise to SEVERE if WARNING, too, turns out to be noise;
# unit tests provoke warning paths on purpose, so that is a live possibility.
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
