# Filtered by maven-resources-plugin at build time; git.* values are
# injected by git-commit-id-maven-plugin (see pom.xml). The version is
# the Maven CI-friendly revision passed by the release workflow.
groupId=${project.groupId}
artifactId=${project.artifactId}
version=${project.version}
buildNumber=${git.total.commit.count}
gitCommitCount=${git.total.commit.count}
gitCommitHash=${git.commit.id}
gitCommitHashShort=${git.commit.id.abbrev}
gitBranch=${git.branch}
gitCommitTime=${git.commit.time}
buildTimestamp=${maven.build.timestamp}
