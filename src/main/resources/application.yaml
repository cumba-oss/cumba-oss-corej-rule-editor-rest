spring:
  application:
    name: corej-rule-editor-rest
  mvc:
    problemdetails:
      # Spring MVC's own errors (404, 405, unreadable bodies) in the same RFC 9457 shape the
      # editor's EditorExceptionHandler uses, so the SPA parses one error format.
      enabled: true

server:
  port: 8081
  servlet:
    session:
      # PLAN-rule-editor §5.1.4 (review L1): the forge token lives only in the server-side session.
      # A rule author's session must outlive a long editing afternoon: a 401 on Save keeps the
      # buffers in the browser and re-authenticates in a dialog (§5.2, review L4), so a long
      # timeout costs nothing but memory. Sessions are never persisted across restarts.
      timeout: 8h
      persistent: false
      cookie:
        http-only: true
        same-site: lax
        # Production serves HTTPS (phase 4 reverse proxy / TLS). A plain-HTTP developer run must
        # override this or the browser never sends the cookie back:
        #   --server.servlet.session.cookie.secure=false
        secure: true
  # No actuator, so no heapdump / env endpoint exists (§5.1.4). Nothing to disable.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# The editor's installation configuration (PLAN-rule-editor §5.1.1). One instance is bound to ONE
# git repository (O9); the forge behind it answers the login probe (§5.1.3).
editor:
  repository:
    # The clone URL. Owner and repository name are its last two path segments.
    url: https://forge.example.org/owner/rules.git
    # Blank = the branch the forge reports as the repository's default at login (anonymous mode
    # reads the remote HEAD instead). Set it only to pin a different branch as "default".
    default-branch:
  forge:
    # gitea | github
    type: gitea
    # Gitea: <host>/api/v1 ; GitHub: https://api.github.com
    api-url: https://forge.example.org/api/v1
  # One clone per forge user id lives under here (§5.1.5). Must be writable by the service.
  workspace-root: ./workspaces
  workspace:
    # A workspace untouched for this long AND holding nothing uncommitted or unpushed is deleted
    # by the retention sweep (§5.1.5). 0 disables the sweep.
    retention-days: 90
    # How often the retention sweep runs (ISO-8601 duration).
    retention-interval: PT6H
  anonymous:
    # Opt-in for a PUBLIC repository only (RE-Q12, §5.1.6): a server-owned clone of the default
    # branch is served read-only to unauthenticated users. Every refresh re-probes anonymous
    # visibility and switches this off when the probe fails.
    enabled: false
    # How often the anonymous clone is refreshed from the remote (ISO-8601 duration).
    refresh-interval: PT10M
  cors:
    # The deployment shapes of §4.2: (1) the SPA bundled into this jar (-Pbundle-web) and (2) the
    # SPA behind a reverse proxy that forwards /api are SAME-ORIGIN and need nothing here. Only
    # the two-apps-on-sibling-subdomains variant of (2) lists the SPA's origin(s) here — exact
    # origins, credentials on — and then also sets server.servlet.session.cookie.domain to the
    # site so the session cookie reaches both. Empty (default): no cross-origin request is
    # answered. ⛔ A cross-SITE deployment is not supported (SameSite=Lax cookie, session-bound
    # CSRF token).
    allowed-origins: []
  # ---- the engine (phase 3) -------------------------------------------------------------
  # The metadata store file every analysis, completion, tooltip and run reads (databrowser-meta
  # CLAUDE.md: CDISC Library content comes ONLY from our store; the editor never seeds). Blank =
  # the engine's own resolution: CDISC_METADATA_STORE, then -Dcdisc.metadata.store. A store of
  # another format is refused by the engine and the instance runs without one (analysis still
  # works, scope completion is empty, a scenario needing the store fails with the reason).
  metadata-store:
  run:
    # Every run is a child JVM (§5.8.5, review H5): a hard heap cap, killed past the wall-clock
    # timeout; max-concurrent workers at once, max-queued waiting up to queue-wait, beyond that
    # 503 RUN_BUSY. Size the heap for the biggest scenario a user may paste, not for a study.
    max-heap: 1g
    timeout: PT60S
    max-concurrent: 2
    max-queued: 4
    queue-wait: PT30S
    # Anonymous mode only: runs per minute per client address, beyond that 429 RATE_LIMITED.
    anonymous-runs-per-minute: 6
    # The worker's class path and java; blank derives both from this JVM (under the
    # bootstrap launcher: <bundle>/lib/*). Set them only for an unusual layout.
    classpath:
    java-command:
    # How much of a worker's stderr is kept for the server log when it fails.
    worker-log-bytes: 16384
  limits:
    # Analysed and run buffers (a rule, a scenario) above this answer 413 TOO_LARGE.
    max-buffer-bytes: 1048576

logging:
  level:
    # The engine logs every authored Sensitivity that overrides its derivation at INFO, once per
    # rule per load — a whole-corpus index would print thousands of lines.
    net.cumba.corej.core.RulePackageLoader: WARN
