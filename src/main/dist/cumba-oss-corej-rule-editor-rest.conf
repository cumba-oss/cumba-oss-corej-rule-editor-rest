# Sidecar configuration for the bootstrap launcher.
#
# ⚠ The launcher jar and this file MUST share a basename. The launcher takes the
# jar it was loaded from, strips ".jar" and appends ".conf", and looks for the
# result beside it — so renaming one means renaming both. (An explicit
# -Dbootstrap.config=<path> overrides the whole lookup.)
#
# ⚠ This file configures the LAUNCHER and the JVM. Spring's own settings — the
# bound repository, the forge, the workspace root, the port, the CORS allow-list —
# belong in config/application.yaml beside it; see [properties] below.

[bootstrap]
main-class = net.cumba.corej.editor.RuleEditorApplication

[properties]

# A self-contained bundle should never silently skip a jar it shipped, so a
# missing classpath entry or an empty glob is a hard failure rather than a
# warning. (WARN is the launcher's default.)
#
# ⚠ Written through ${sys:...} so `-Dclasspath.error.mode=WARN` still relaxes it.
# A bare `= ERROR` would OVERWRITE the command line — see the note on precedence
# below.
classpath.error.mode = ${sys:classpath.error.mode:-ERROR}

# ⭐ EXTERNAL SPRING CONFIGURATION.
#
# `additional-location`, not `location`: the packaged application.yaml inside the
# jar still applies and config/application.yaml only OVERRIDES it, so an operator
# edits the handful of keys they care about instead of restating the whole file.
#
# ⚠ The trailing slash is required. Without it Spring Boot reads the value as a FILE
# path and REFUSES TO START ("If the location is meant to reference a directory, it
# must end in '/'"). The slash is appended here, so COREJ_CONFIG_DIR takes a bare
# directory.
#
# ⚠ `-Dspring.config.additional-location=…` on the command line does NOT work: this
# line overwrites it ([properties] entries are applied with an UNCONDITIONAL
# System.setProperty). The knob is COREJ_CONFIG_DIR, or -Dcorej.config.dir; both
# take a DIRECTORY and the slash is added here.
#
# ⭐ Reading outwards, the precedence is: COREJ_CONFIG_DIR > -Dcorej.config.dir >
# the bundle's own config/ directory.
spring.config.additional-location = ${env:COREJ_CONFIG_DIR:-${sys:corej.config.dir:-${bootstrap.dir}/config}}/

# ⭐ THE METADATA STORE (phase 3). Everything that needs CDISC Library content — the
# analysis, completion, tooltips, the scenario runs — reads OUR metadata store, never
# the Library's pickle or web API. Bundle-relative, CWD-independent default, as
# cumba-oss-corej-rest wires its corej.*.dir stores; the environment outranks it:
#
#     CDISC_METADATA_STORE=/srv/metadata-store.zip ./run.sh
#
# The store is a FILE (a zip) seeded separately at the engine's store format (5) with
# the coreJ CLI or data browser flow; an older format is refused at startup and the
# service then runs WITHOUT a store (analysis still works, scope completion is empty,
# a scenario needing the Library fails with that reason), a newer one is never
# replaced. The run workers receive the same path from the service.
editor.metadata-store = ${env:CDISC_METADATA_STORE:-${sys:editor.metadata-store:-${bootstrap.dir}/metadata-store/metadata-store.zip}}

# ⭐ THE BRAND DIRECTORY (PLAN-web-branding-and-theme). With the SPA bundled into the jar
# (-Pbundle-web), /brand/ is the brand EDITOR_BRAND_NAME selects (default neutral; p300 ships
# with the SPA). A brand of your own is a folder <directory>/<name>/ holding a brand.css:
# by default the bundle's own config/brands/ (or wherever COREJ_CONFIG_DIR points, so a brand
# dropped into /etc/rule-editor/brands/acme/ in the container is found with no further
# setting). Same three-level shape as corej.rules.dir in cumba-oss-corej-rest's .conf — the
# environment outranks a -D, which outranks the bundle default — because [properties]
# entries are applied with an UNCONDITIONAL System.setProperty. Inert in an API-only bundle.
editor.brand.directory = ${env:EDITOR_BRAND_DIRECTORY:-${sys:editor.brand.directory:-${env:COREJ_CONFIG_DIR:-${sys:corej.config.dir:-${bootstrap.dir}/config}}/brands}}

# ⚠ MEMORY. JAVA_OPTS (run.sh) sizes THIS JVM only. Every run is a child JVM with its
# own heap, editor.run.max-heap (config/application.yaml, default 1g), up to
# editor.run.max-concurrent at once: budget the host for
# JAVA_OPTS heap + max-concurrent × max-heap. The workers' class path is this
# bundle's lib/* (derived from bootstrap.dir), their java is this JVM's.

[classpath]
# ⚠ Bare path entries, one per line — NOT `key = value`. This section is why the
# file is a .conf and not an .ini.
#
# The application jar first, then the rest of lib/. The launcher de-duplicates by
# canonical path with first-occurrence-wins, so the application jar is added
# exactly once and keeps its leading position. Its static/ (the bundled SPA, when
# built with -Pbundle-web) is served from there.
${bootstrap.dir}/lib/cumba-oss-corej-rule-editor-rest-*.jar
${bootstrap.dir}/lib/*.jar

# ⚠ RELOCATING THE BUNDLE. Moving or renaming the whole directory is fine —
# ${bootstrap.dir} follows it. But `-Dbootstrap.config=/elsewhere/foo.conf` moves
# ${bootstrap.dir} to THAT file's directory, and a lib/ that is a SYMLINK matches
# nothing (the launcher's glob walks with Files.walk, which does not descend a
# symlinked start directory). Bind-mount, or point these lines at the real path.
