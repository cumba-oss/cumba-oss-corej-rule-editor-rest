# External Spring configuration for this bundle.
#
# The launcher points Spring at this directory with
# `spring.config.additional-location` (see cumba-oss-corej-rule-editor-rest.conf), so
# everything here OVERRIDES the application.yaml packaged inside the jar and
# leaves the rest of it in place. Uncomment only what you need; the packaged file
# documents every key.
#
# Restart the service after editing.

#server:
#  port: 8081
#  servlet:
#    session:
#      cookie:
#        # The cookie is Secure by default and stays so: serve HTTPS (a TLS-terminating
#        # proxy). Plain HTTP to anything but localhost is NOT supported; false is a
#        # trial opt-out for a throw-away instance only (security review M3).
#        secure: false
#        # Two apps on sibling subdomains of ONE site (PLAN-rule-editor §4.2 shape 2):
#        # the cookie's domain must cover both.
#        domain: example.org

